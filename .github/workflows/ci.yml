name: CI

# Önálló workflow, hogy a Pages-deploy megszűnése (a demó lebontása) után is
# megmaradjon. A deploy.yml ennek a sikeres master-pushos futására indul.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Workflow script tests
        working-directory: app
        run: npm run test:workflow

      - name: Docs check
        working-directory: app
        run: npm run docs-check

      - name: Type-check + build
        working-directory: app
        run: npm run build

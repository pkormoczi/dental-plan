name: Release

# A két telepítő nem építhető megbízhatóan egy gépről (macOS-re nincs keresztfordítás), ezért
# platformonként a saját runnerén készül. `v*` tagre publikál; a kézi indítás (workflow_dispatch)
# próbafutás: build, tesztek és run-artifact, Release nélkül.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-or:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Nyilvános kiadás csak pusholt, kapun átment kódból: a tag a master egy commitjára mutasson.
      - name: A tagelt commit a master őse
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::A $GITHUB_REF_NAME tag nem a master egy commitjára mutat."
            exit 1
          fi

  build:
    needs: master-or
    strategy:
      matrix:
        # Az Intel-runner ugyanazt a universal csomagot építi, és natívan az x64-szeletét
        # füst-teszteli -- az arm64-runner a universal binárisból az arm64-et futtatná.
        os: [windows-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # A jsdom-készlet architektúra-független: a Windows- és az arm64-runner futtatja. Az
      # Intel-runner annyira lassú, hogy a 15 s-os teszt-timeoutot rendszeresen túllépi; ott csak
      # a universal csomag x64-szeletének füst-tesztje a dolga.
      - name: Run tests
        if: matrix.os != 'macos-26-intel'
        working-directory: app
        run: npm test

      # A verzió egyetlen forrása a tag; a repó package.json-ja nem léptetődik.
      - name: Verzió a tagből
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Csomagolás
        working-directory: app
        run: npm run electron:package

      - name: A mac bináris mindkét architektúrát tartalmazza
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          archs=$(lipo -archs "release/mac-universal/Mandoki Dental.app/Contents/MacOS/Mandoki Dental")
          echo "lipo -archs: $archs"
          for a in x86_64 arm64; do
            case " $archs " in
              *" $a "*) ;;
              *) echo "::error::A universal binárisból hiányzik a(z) $a szelet ($archs)."; exit 1 ;;
            esac
          done

      - name: Füst-teszt a kicsomagolt csomagon
        working-directory: app
        run: npx playwright test -c e2e

      # A Playwright lapállapot-pillanatképe: a runneren bukó teszt oka enélkül nem látszik.
      - name: Füst-teszt kimenete hibánál
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fust-teszt-${{ matrix.os }}
          path: app/test-results
          if-no-files-found: ignore

      # Az Intel-runner dmg-je ugyanazt a fájlnevet viselné: a publikáló merge-multiple-je ütközne.
      - name: Telepítő feltöltése
        if: matrix.os != 'macos-26-intel'
        uses: actions/upload-artifact@v7
        with:
          name: telepito-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Csak ez a job kap írási jogot; a két build nem versenyez ugyanazért a Release-ért.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Telepítők letöltése
        uses: actions/download-artifact@v8
        with:
          path: telepitok
          merge-multiple: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elozetes=""
          case "$GITHUB_REF_NAME" in *-*) elozetes="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" telepitok/* docs/TELEPITES.md \
            --verify-tag $elozetes \
            --title "Mándoki Dental $GITHUB_REF_NAME" \
            --notes "Telepítés és frissítés: a csatolt TELEPITES.md lépései szerint."

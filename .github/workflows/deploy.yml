name: Deploy mockup to GitHub Pages

# A tényleges alkalmazás az app/ almappában van -- lásd CLAUDE.md
# "Két fázisú build". Ez a workflow csak a mockupot (1. fázis) deployolja.

# PR-en csak a build-job fut (a worktree-ág merge előtti bizonyítéka); élesítés csak
# master-pushra és kézi indításra.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Workflow script tests
        working-directory: app
        run: npm run test:workflow

      - name: Docs check
        working-directory: app
        run: npm run docs-check

      - name: Type-check + build
        working-directory: app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
